[project]
name = "GeminiForJanitors"
version = "0.1.0"
description = "Google AI Studio Proxy for JanitorAI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "colorama>=0.4.6",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gevent>=26.7.0",
    "gunicorn>=26.0.0",
    "httpx2[brotli,http2,zstd]>=2.9.1",
    "redis>=8.0.1",
]

[project.optional-dependencies]
memory = [
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

[tool.pytest]
minversion = "9.0"
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated"
]
